[package]
name = "systemprompt-web-admin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Admin dashboard extension for the systemprompt.io template: governed operations UI over agents, MCP servers, users, and analytics."
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
# Foundation
systemprompt-web-shared = { workspace = true }
# Audit: uses ai, identifiers, models, oauth, security — requires `full`.
systemprompt = { workspace = true, features = ["full"] }
systemprompt-email-extension = { workspace = true }
systemprompt-credits-extension = { workspace = true }
systemprompt-security = { workspace = true }

# Database
sqlx = { workspace = true }

# Web framework
axum = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Loopback HTTP to the systemprompt MCP hub (handlers/pi/mcp.rs). Pinned to the
# 0.12 line already in the graph via the core CLI, with default features off:
# the call is plain HTTP to an address only this server can reach, and the 0.13
# workspace spec pulls an aws-lc TLS backend this crate has no use for.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Crypto & encoding
sha2 = { workspace = true }
chacha20poly1305 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }

# Templating
handlebars = { workspace = true }

# Archive
tempfile = { workspace = true }

# HTTP client

# Utilities
url = { workspace = true }
urlencoding = { workspace = true }
inventory = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
