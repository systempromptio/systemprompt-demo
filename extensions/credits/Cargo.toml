[package]
name = "systemprompt-credits-extension"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Credit ledger extension for systemprompt.io — signup grants, balance, and gateway enforcement."
license = "MIT"

[lints]
workspace = true

# inventory: compile-time registration via register_extension!/register_gateway_guard!
