# Scheduler Configuration
# Background jobs and scheduled tasks.
#
# Every job declares an explicit `owner:` — a real users.name that authorizes
# this job's actions. The configured owner becomes JobContext.actor for every
# `execute()` call and is the principal recorded in audit rows.
#
# No "system" user. No magic strings. `admin` is the bootstrap admin user
# created at install time (`just setup-local`). Deployments that want a
# different authorizer should change `owner:` to a different admin's username.

scheduler:
  enabled: true
  jobs:
    # Core jobs (defined in systemprompt-core)
    - name: cleanup_anonymous_users
      extension: core
      owner: admin
      schedule: "0 0 3 * * *"
      enabled: true

    # DISABLED — destroys MCP tool-call audit rows.
    #
    # Core defines "empty" as "has no task_messages" and prunes after a
    # hardcoded 1 hour. A demo visitor who drives the tool surface without
    # chatting produces exactly that shape, so their context is deleted, and
    # database_cleanup below then reaps their mcp_tool_executions as orphans.
    # Neither window is expressible in YAML, so the only lever is `enabled`.
    # Replaced by the web extension's `retention` job.
    - name: cleanup_empty_contexts
      extension: core
      owner: admin
      schedule: "0 0 * * * *"
      enabled: false

    - name: cleanup_inactive_sessions
      extension: core
      owner: admin
      schedule: "0 0 * * * *"
      enabled: true

    # DISABLED — its delete_orphaned_mcp_executions sweep hard-deletes
    # governance audit rows with NO age guard at all, keyed on a context_id
    # that carries no foreign key. Removed from bootstrap_jobs below too: it
    # ran on every process start, so each deploy took another bite.
    # Replaced by the web extension's `retention` job.
    - name: database_cleanup
      extension: core
      owner: admin
      schedule: "0 0 4 * * *"
      enabled: false

    # Replaces the two disabled core cleanup jobs above.
    #
    # Governance audit rows (mcp_tool_executions) are kept for 90 days, flat.
    # The dashboard aggregates them as lifetime totals, so anything shorter
    # would make the published usage numbers decay on their own. Empty
    # contexts — no messages, no tool calls, owner inactive — carry no
    # statistic and go after 7 days.
    #
    # `enforce: false` (the default) makes it report what it would delete
    # without deleting. Flip it on once the reported counts look right.
    #
    # The windows are not yet settable here: core's JobConfig is
    # deny_unknown_fields with no `parameters` map, so the job reads its own
    # defaults. Adding that field to core is the follow-up that makes this
    # block fully self-describing.
    - name: retention
      extension: web
      owner: admin
      schedule: "0 0 4 * * *"
      enabled: true
      enforce: false

    # Web extension jobs (publishing pipeline)
    - name: publish_pipeline
      extension: web
      owner: admin
      schedule: "0 */15 * * * *"
      enabled: true

    # Standalone core jobs, running on each job's built-in default schedule
    # (no `schedule:` override). Security jobs run in observe-and-log mode
    # because `enforce:` defaults to false.
    # Offset off :00 for the same reason as content_analytics_aggregation —
    # its built-in default collides with publish_pipeline. :10/:25/:40/:55.
    - name: no_js_cleanup
      extension: core
      owner: admin
      schedule: "0 10-59/15 * * * *"
      enabled: true

    - name: ghost_session_cleanup
      extension: core
      owner: admin
      enabled: true

    - name: mcp_session_cleanup
      extension: core
      owner: admin
      enabled: true

    - name: file_ingestion
      extension: core
      owner: admin
      enabled: true

    - name: behavioral_analysis
      extension: core
      owner: admin
      enabled: true

    - name: malicious_ip_blacklist
      extension: core
      owner: admin
      enabled: true

    # Standalone web extension jobs
    #
    # Offset off :00 deliberately. This job's built-in default is
    # "0 */15 * * * *" — the same second as publish_pipeline and no_js_cleanup,
    # so all three woke together every quarter hour and queued on each other's
    # pg_advisory_lock, each holding a pool connection while blocked. On a small
    # machine that is enough to starve web requests. :05/:20/:35/:50 keeps the
    # 15-minute cadence and lands between the other two.
    - name: content_analytics_aggregation
      extension: web
      owner: admin
      schedule: "0 5-59/15 * * * *"
      enabled: true

    - name: secret_migration
      extension: web
      owner: admin
      enabled: true

    # publish_pipeline sub-steps. The composite above runs each of these every
    # 15 minutes in dependency order; scheduling them independently would
    # double-run them, so they are disabled here (an explicit entry also
    # records the decision and silences the boot warning).
    - name: blog_content_ingestion
      extension: web
      owner: admin
      enabled: false

    - name: bundle_admin_css
      extension: web
      owner: admin
      enabled: false

    - name: copy_extension_assets
      extension: web
      owner: admin
      enabled: false

    - name: content_prerender
      extension: core
      owner: admin
      enabled: false

    - name: page_prerender
      extension: core
      owner: admin
      enabled: false

    - name: sitemap_generation
      extension: web
      owner: admin
      enabled: false

    - name: llms_txt_generation
      extension: web
      owner: admin
      enabled: false

    - name: robots_txt_generation
      extension: web
      owner: admin
      enabled: false

  # Run once, serially, at startup before the cron loop begins.
  #
  # governance_bootstrap is boot-only: it has no `jobs` entry (so it is never
  # cron-scheduled) and declares an empty schedule. Its owner defaults to the
  # system admin. It materialises the profile's gateway-route entities and
  # projects services/access-control + gateway-policy YAML into the authz tables
  # so authorization is correct at app start.
  # database_cleanup is deliberately absent: core lists it in its own
  # default_bootstrap_jobs(), so it fired on every restart and deploy. This
  # explicit list overrides that default and is what keeps it from running.
  bootstrap_jobs:
    - governance_bootstrap
    - cleanup_inactive_sessions
    # Publish web assets before the cron loop: web/dist is generated, not
    # shipped in the image, so without this the site 404s until the first
    # 15-minute publish_pipeline tick.
    - publish_pipeline
