# Governance plugin — the one plugin that owns this instance's hooks.
#
# Claude Code runs plugin hooks session-globally: a PreToolUse hook with a "*"
# matcher fires for every tool call regardless of which plugin contributed the
# tool. Exactly one enabled plugin may therefore set `hooks.governance: true`;
# two or more is a hard validation error, zero means no tool call is checked.
#
# Auto-discovered from services/plugins/<id>/config.yaml — deliberately absent
# from services/config/config.yaml's `includes:` list.

plugin:
  id: systemprompt
  name: "systemprompt.io"
  description: "Governance demo — a tool call refused by policy, plus skills that explain and measure what the governance spine is doing"
  version: "2.0.0"
  enabled: true
  author:
    name: systemprompt.io
    email: support@systemprompt.io
  keywords:
    - governance
    - demo
    - enterprise
  license: proprietary
  category: governance

  skills:
    source: explicit
    include:
      - explain_systemprompt
      - browse_site_content
      - demonstrate_governance
      - demonstrate_tool_rejection
      - demonstrate_scope_rejection
      - demonstrate_gateway_safety
      - analyse_governance_stats
      - demonstrate_artifacts
    exclude: []

  agents:
    source: explicit
    include:
      - developer_agent
      - associate_agent
    exclude: []

  mcp_servers:
    source: explicit
    include:
      - systemprompt
    exclude: []

  content_sources:
    source: instance
    include: []
    exclude: []

  # `governance: true` emits the built-in govern (PreToolUse) and track
  # (PostToolUse) HTTP hooks, with their URLs generated against this
  # deployment's real base URL. Hand-writing them in services/hooks/ is what
  # left the previous pair pointing at a port nothing listens on.
  hooks:
    governance: true
    include:
      - example_hook
