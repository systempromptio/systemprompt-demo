# Navigation Configuration
# Header, footer, and documentation sidebar
#
# All external links point back to https://systemprompt.io.
# The Login entries are the only local routes (they target the running
# template instance's admin login page).

header:
  items:
    - id: resources
      label: "Resources"
      href: "/resources/"
    - id: login
      label: "Login"
      href: "/login"
  cta:
    label: "Get started"
    href: "/register"

footer:
  resources:
    - path: "/resources/"
      label: "Resources"
    - path: "https://systemprompt.io/documentation/"
      label: "Documentation"
      external: true
    - path: "/login"
      label: "Login"
  legal:
    - path: "https://systemprompt.io/legal/privacy-policy"
      label: "Privacy Policy"
      external: true
    - path: "https://systemprompt.io/legal/cookie-policy"
      label: "Cookie Policy"
      external: true
    - path: "https://systemprompt.io/legal/terms-of-service"
      label: "Terms of Service"
      external: true
    - path: "https://systemprompt.io/legal/refund-policy"
      label: "Refund Policy"
      external: true
  contact:
    - href: "https://discord.gg/wkAbSuPWpr"
      label: "Discord"
    - href: "https://www.linkedin.com/in/edjburton/"
      label: "LinkedIn"
    - href: "https://github.com/systempromptio"
      label: "GitHub"

social:
  - href: "https://github.com/systempromptio"
    type: "github"
    label: "GitHub"
  - href: "https://x.com/tyingshoelaces_"
    type: "twitter"
    label: "Twitter"

# Docs sidebar - rendered dynamically via site.docs_sidebar in templates
docs_sidebar:
  - title: "Terminal Demos"
    links:
      - label: "Setup & Authentication"
        href: "/documentation/demo-terminal-setup"
      - label: "Governance Decisions"
        href: "/documentation/demo-terminal-agents"
      - label: "Audit Trails & Costs"
        href: "/documentation/demo-terminal-audit"
      - label: "Governance API"
        href: "/documentation/demo-terminal-governance"
      - label: "MCP Access Tracking"
        href: "/documentation/demo-terminal-mcp"
      - label: "Request Tracing & Benchmark"
        href: "/documentation/demo-terminal-tracing"
      - label: "Agent Tracing"
        href: "/documentation/demo-terminal-agent-tracing"

  - title: "Dashboard"
    links:
      - label: "Authentication & Login"
        href: "/documentation/authentication"
      - label: "Dashboard Usage"
        href: "/documentation/dashboard"
