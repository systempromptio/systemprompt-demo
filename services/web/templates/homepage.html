<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {{{HEAD_ASSETS}}}
    <title>{{site.branding.title}}</title>
    <meta name="description" content="{{site.branding.description}}">
    <link rel="icon" type="image/x-icon" href="{{FAVICON_PATH}}">
    <link rel="canonical" href="{{ORG_URL}}">
    <meta property="og:title" content="{{site.branding.title}}">
    <meta property="og:description" content="{{site.branding.description}}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ORG_URL}}">
    <meta property="og:image" content="{{site.branding.image}}">
    <meta property="og:site_name" content="{{site.branding.name}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="{{TWITTER_HANDLE}}">
    <meta name="twitter:title" content="{{site.branding.title}}">
    <meta name="twitter:description" content="{{site.branding.description}}">
    <meta name="twitter:image" content="{{site.branding.image}}">
    <meta name="theme-color" content="{{site.branding.themeColor}}">
    <link rel="stylesheet" href="{{CSS_BASE_PATH}}/components/pi-terminal.css">
    <link rel="stylesheet" href="{{CSS_BASE_PATH}}/components/home-split.css">
    <link rel="stylesheet" href="{{CSS_BASE_PATH}}/components/auth-pane.css">
    <script src="{{JS_BASE_PATH}}/services/pi-render.js" defer></script>
    <script src="{{JS_BASE_PATH}}/services/pi-gate-view.js" defer></script>
    <script src="{{JS_BASE_PATH}}/services/sp-pi-terminal.js" defer></script>
    <script type="module" src="{{JS_BASE_PATH}}/services/sp-auth-pane.js"></script>
</head>
<body class="home-split-body">
    {{{HEADER}}}

    <main id="main" class="home-split">
        <section class="home-split-pane home-split-pane--terminal" aria-label="Governed agent terminal">
            <sp-pi-terminal endpoint="/api/public/pi"></sp-pi-terminal>
            <p class="home-split-note">Read-only tools, one session per account, ten-minute idle
                timeout. Every decision lands an audit row you can query.</p>
        </section>
        <section class="home-split-pane home-split-pane--profile" aria-label="Your account and agent telemetry">
            <sp-auth-pane></sp-auth-pane>
        </section>
    </main>

    <!--
      Signing in happens in the pane without a navigation, so nothing reloads
      the terminal. This is the one wire between the two halves: the pane says
      an identity now exists, and the terminal starts a real session against it.
    -->
    <script>
        document.addEventListener('sp-auth:authenticated', function () {
            var t = document.querySelector('sp-pi-terminal');
            if (t && t.restart) t.restart();
        });
        document.addEventListener('sp-auth:signed-out', function () {
            var t = document.querySelector('sp-pi-terminal');
            if (t && t.restart) t.restart();
        });
    </script>

    {{{SCRIPTS}}}
</body>
</html>
