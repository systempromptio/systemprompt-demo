# pi web terminal — the live agent on the homepage.
#
# Read directly by extensions/web/admin/src/handlers/pi/config.rs, not through
# services/config/config.yaml's `includes:` — same as blog.yaml and
# web/config.yaml, which the extension owns rather than ServicesConfig.
#
# There is no enable flag. The terminal is the site's primary demo, so it is
# always mounted; what this file controls is how a session is bounded. Every
# key is optional and defaults to the value shown here, so deleting the file
# leaves a working deployment. Unknown keys are a startup error, and a file
# that fails to parse or validate is reported at ERROR and replaced by these
# same defaults.
#
# Install pi first (pin must match expected_version below):
#   npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.82.0
#
# There is no gateway credential to configure: each conversation mints a
# short-lived PAT for the signed-in user who opened it, and revokes it — along
# with the session it attested — when the conversation ends.

# pi is a `#!/usr/bin/env node` script and the child is spawned with a cleared
# environment, so `binary` must be resolvable on `child_path` and nowhere else.
# If pi lives under nvm, BOTH of these need the nvm bin directory or the child
# dies at exec:
#   binary: /home/you/.nvm/versions/node/v22.19.0/bin/pi
#   child_path: /home/you/.nvm/versions/node/v22.19.0/bin:/usr/local/bin:/usr/bin:/bin
# A bare `pi` resolves against child_path, so one config works everywhere the
# PATH below covers: the nvm install on the dev host and /usr/bin in the
# Docker image (the Dockerfile installs the pinned pi via nodesource npm).
binary: pi
child_path: /home/ejb503/.nvm/versions/node/v22.19.0/bin:/usr/local/bin:/usr/bin:/bin

# The pin is asserted by running `pi --version` once at first spawn. It is
# load-bearing security, not compatibility hygiene: the RPC frame shapes this
# server parses are unversioned on the wire, and the skills story depends on
# `--skill` staying additive under `--no-skills` — both track whatever
# `npm install -g` last wrote to `binary`. `required` refuses to spawn on a
# mismatch (POST /session 500s); `warn` logs and continues; `off` disables.
# After a deliberate upgrade, re-verify those two behaviours and move the pin.
expected_version: "0.82.0"
version_check: required

# Put this on a size-capped tmpfs in production.
workspace_root: /tmp/systemprompt-pi-sessions

# base_url is omitted on purpose: it defaults to the profile's
# server.api_internal_url, so sessions call back on whatever origin is serving
# them. Set it only to point them somewhere else.

provider: systemprompt
# Default model: gpt-oss-120b served via the Cerebras backend route — picked
# for first-token speed, which is what a demo terminal lives or dies on. The
# registry entry is `surface: backend`, so it is offered here only because an
# explicit gateway route (`gpt-oss-120b -> cerebras`) exists. Claude and GPT
# stay one click away in the picker below.
model: gpt-oss-120b

# The models a visitor may pick in the terminal come from the profile's
# provider registry — the same catalogue the gateway routes by — so every
# advertised model of every advertised provider (anthropic, openai, gemini,
# and anything else registered via `systemprompt admin config catalog`) is
# offered automatically. `model` above is the default and always leads the
# list.
#
# `models` is an OPTIONAL narrowing filter, not the source: leave it empty (or
# omit it) to offer the whole catalogue; list ids to offer only those. POST
# /session refuses anything the gateway would not serve either way.
#
# Narrowed to one model per class — the picker is a demo surface, and forty
# ids of version archaeology read as noise where eight read as a range. The
# class's latest wins; superseded versions stay in the registry and still
# route, they are just not offered here.
models:
  - gpt-oss-120b                 # Cerebras: open-weights flagship (default)
  - claude-opus-4-8              # Anthropic: latest Opus
  - claude-sonnet-4-6            # Anthropic: latest Sonnet
  - claude-haiku-4-5-20251001    # Anthropic: latest Haiku
  - gpt-5.1                      # OpenAI: latest flagship
  - gpt-5-mini                   # OpenAI: latest mini
  # Gemini is withheld: pi's Anthropic client drops the per-turn
  # thoughtSignature Gemini requires on replayed functionCall parts. Core now
  # re-injects cached signatures server-side; restore once that fix is
  # committed, published, and verified end-to-end from this repo.

# Who the agent says it is. Omitted here on purpose: it defaults to
# services/config/pi-persona.md, which is compiled into the binary — the child
# is jailed, so it could not read the file at spawn time anyway. Edit that file
# and rebuild to change the identity; set `persona: ""` to drop it entirely and
# run on pi's stock prompt, which introduces itself as pi.
#
# It is APPENDED to pi's built-in prompt, never a replacement: the tool-use half
# of that prompt is what the RPC and approval flow depend on.

# ⚠ Enforced by pi itself. Do NOT widen to bash/write/edit on a
# single-container deployment: the Landlock jail below confines paths and
# ports, but it is not a namespace — the child still runs as this uid in this
# pid namespace. The governance chain gates intent, not blast radius. Widening
# needs a container per session.
# The mcp__systemprompt__* entries are registered by the MCP-client extension
# (handlers/pi/shim/mcp-client.ts), and pi's allowlist covers extension tools
# too — a hub tool missing here is dropped before the model sees it, which is
# indistinguishable from the extension having failed to load.
tools:
  - read
  - mcp__systemprompt__list_topics
  - mcp__systemprompt__get_topic
  - mcp__systemprompt__search_docs
  # The live-site pair: they read the site's own markdown endpoint and nothing
  # else — the input is {section, slug}, never a URL — which is why this egress
  # is allowed while fetch_remote_docs below stays refused.
  - mcp__systemprompt__list_site_pages
  - mcp__systemprompt__fetch_site_page
  - mcp__systemprompt__governance_stats
  - mcp__systemprompt__safety_findings
  # The artifact showcase: one artifact of any visual type, so the shelf can
  # be demonstrated through the same governed path as every other call.
  - mcp__systemprompt__render_artifact
  # The next two are registered on purpose so that a policy has something to
  # refuse. Removing either removes a demonstration, not the risk it stands for.
  #
  # `admin_audit_dump` really does read every identity's audit rows, and
  # `scope_check` is the only thing standing between a visitor and that dump —
  # its `admin_` prefix is matched by admin_only_prefixes in
  # services/governance/config.yaml, and this terminal caps every caller at
  # `user` scope. Both halves are load-bearing; a test pins the pair.
  - mcp__systemprompt__admin_audit_dump
  # Refused by tool_blocklist, which is what keeps this deployment's no-egress
  # claim from being a matter of trust.
  - mcp__systemprompt__fetch_remote_docs

# `required` means no child spawns unless sp-pi-jail reports a fully-enforced
# Landlock ruleset — POST /session 500s rather than falling back to an
# unconfined child. There is deliberately no best-effort value: pi's own `read`
# applies no path containment, so without the jail one approved tool call reads
# this file's real counterpart.
#
# Needs Linux 5.13+ for filesystem confinement and 6.7+ for the outbound-TCP
# rule. Below 6.7 the child's network is unconfined and sp-pi-jail says so on
# stderr. `off` is for older kernels and non-Linux dev hosts, logs one WARN at
# startup, and is only safe where nobody untrusted can sign in.
sandbox: required

# Ask a human about every tool call, not just flagged ones. With a read-only
# tool set nothing is flagged, so this is what makes the approval UI visible.
approve_all: true

timeouts:
  approval_secs: 120       # how long a tool call waits on a human, then fails closed
  idle_secs: 600
  max_lifetime_secs: 3600

sessions:
  max_per_user: 1          # a request past this closes the account's oldest
  max_total: 8
  # Sizing max_total: each session is one Node process — typically 100–300 MiB
  # RSS, hard-ceilinged at `address_space` below. 8 sessions ≈ ~2.5 GiB RSS
  # worst case (16 GiB VSZ ceiling); 16 sessions doubles that. Raise only on a
  # host with that much headroom left over after Postgres and the gateway.

# Per-IP limits on the two endpoints that mint things: POST /session (spawns
# a process) and POST /embed-token (mints a credential). Everything else on
# /api/public/pi/* requires one of those to have succeeded first. Counted per
# x-forwarded-for address in a sliding window; zero disables a lane. NAT
# caveat: many visitors behind one address share a budget — raise these before
# demoing to a room on one network.
throttle:
  session_per_ip: 5
  embed_token_per_ip: 10
  window_secs: 60

# Child resource ceilings. Zero means unset.
# - RLIMIT_AS: measured against pi 0.82.0 / node 22 — the child starts under a
#   2 GiB ceiling and dies under 1 GiB (V8 reserves its pointer cage up
#   front), so 2 GiB is the floor. Re-measure when moving the version pin: a
#   too-low value kills the child at startup, which the server logs as a
#   fast-exit hint.
# - RLIMIT_NPROC counts every process the *uid* owns rather than the child's
#   descendants, and needs bash (dash has no `ulimit -u`) — a blunt but real
#   fork-bomb backstop until the child has its own uid. Because it is
#   per-uid, the value must sit ABOVE the uid's steady-state thread count or
#   node dies at startup on uv_thread_create (measured: a shared dev box idles
#   at 800+ threads, so 128 killed every child; 2048 still stops a fork bomb).
limits:
  nproc: 2048
  fsize: 67108864          # 64 MiB per file
  # Measured floor for pi 0.82.0 / node 22: the provider fetch path (undici's
  # llhttp Wasm guard regions on top of V8's pointer cage) dies under a 20 GiB
  # ceiling and works at 24 GiB — the child starts fine either way, then every
  # provider request fails instantly as "Connection error." with no connect()
  # ever issued, which is what makes a too-low value so misleading. Measured
  # with the real jailed child, not bare `node -e "fetch(...)"` (that floor is
  # ~10 GiB and undershoots). Virtual, not resident: RSS stays 100–300 MiB per
  # session regardless. Re-measure when moving the version pin.
  address_space: 34359738368 # 32 GiB

# Where the systemprompt MCP hub answers. Called server-side by the proxy in
# handlers/pi/mcp.rs — never by the child, which cannot reach this port. The
# hub trusts the identity headers it is handed, so this must stay an address
# only this server can reach.
mcp_url: http://127.0.0.1:5010/mcp

# jail_binary defaults to sp-pi-jail beside the server binary, which is right
# in both layouts (target/debug in dev, /app/bin in the image). Set it if you
# install elsewhere:
#   jail_binary: /app/bin/sp-pi-jail

# jail_read_paths grants read+execute to the jailed child, REPLACING (not
# extending) the built-in list: the interpreter, its shared libraries, the CA
# bundle, /dev/null and /dev/urandom. pi's own package root is derived from
# `binary` at spawn time and never needs listing. ⚠ Never add /proc —
# /proc/<server-pid>/environ is readable by this uid and holds DATABASE_URL and
# every provider key, which is precisely the hole the jail closes.
#   jail_read_paths: [/usr/bin, /usr/lib, /bin, /lib, /lib64, /etc/ssl, /dev/null, /dev/urandom]
