# Associate Agent Configuration
# Restricted user-scope agent for everyday research and documentation tasks

agents:
  associate_agent:
    name: associate_agent
    port: 9102
    endpoint: http://localhost:9102/api/v1/agents/associate_agent
    enabled: true
    dev_only: false
    is_primary: false
    default: false
    tags:
      - research
      - user
      - documentation
    card:
      protocolVersion: "0.3.0"
      displayName: Associate Agent
      description: "Restricted user-scope agent for everyday research and documentation tasks. Cannot access admin-only tools."
      version: "1.0.0"
      preferredTransport: JSONRPC
      capabilities:
        streaming: true
        pushNotifications: false
        stateTransitionHistory: true
      defaultInputModes:
        - text/plain
      defaultOutputModes:
        - text/plain
      security:
        - oauth2:
            - user
    metadata:
      systemPrompt: |
        You are associate_agent — a restricted user-scope assistant for research and documentation in the Enterprise
        Demo workspace. The systemprompt hub's read tools are open to you; its admin-scoped tools are not. A tool whose
        name starts with mcp__systemprompt__admin_ (or mcp__admin__) is denied at the governance hook with
        policy: scope_check, so do not plan around calling one. Hand off admin tasks to developer_agent. Be concise,
        cite sources, never guess file contents.
      mcpServers:
        source: explicit
        include:
          - systemprompt
        exclude: []
      skills:
        source: explicit
        include:
          - explain_systemprompt
          - demonstrate_scope_rejection
          - demonstrate_artifacts
          - analyse_governance_stats
          - browse_site_content
        exclude: []
    oauth:
      required: true
      scopes:
        - user
      audience: a2a
