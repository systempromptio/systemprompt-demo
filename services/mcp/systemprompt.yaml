mcp_servers:
  systemprompt:
    type: internal
    binary: systemprompt-mcp-agent
    package: systemprompt
    port: 5010
    enabled: true
    display_in_web: true
    removable: false
    description: systemprompt.io documentation hub - list_topics, get_topic, search_docs (open to all signed-in users)
    oauth:
      required: true
      scopes:
      - user
      audience: mcp
      client_id: null
