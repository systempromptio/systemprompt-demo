marketplace:
  id: systemprompt
  name: "systemprompt.io Marketplace"
  description: "The systemprompt.io open gateway plugin: a governed documentation hub (MCP) plus explainer and governance-demo skills, delivered to Claude Desktop and Cowork."
  version: "3.0.0"
  visibility: public
  author:
    name: systemprompt.io
    email: ed@systemprompt.io
  keywords:
    - governance
    - demo
    - enterprise
  license: proprietary
  category: governance
  access:
    default_included: true
    roles: [user]
    justification: "Public enterprise governance evaluation demo"
  skills:
    include:
      - explain_systemprompt
      - explain_governance
      - explore_systemprompt_docs
      - demonstrate_governance
      - use_dangerous_secret
  mcp_servers:
    source: explicit
    include:
      - systemprompt
    exclude: []
  agents:
    include:
      - developer_agent
      - associate_agent
