name: Release — build, sign & publish systemprompt bridge

# Builds the systemprompt.io desktop bridge for macOS (Apple Silicon + Intel),
# Windows, and Linux; signs every artifact with cosign (keyless OIDC); and
# publishes a GitHub Release. Modeled on systemprompt-core's release-sign.yml.
#
# NOTE: the `systempromptio-bridge` crate (bridge/) path-depends on the core bridge at
# `../../systemprompt-core/bin/bridge`, so CI checks out BOTH repos as siblings
# under the workspace. If systemprompt-core is private, set the CORE_REPO_TOKEN
# secret to a PAT/deploy key with read access; for a public core, the default
# token works.

on:
  push:
    tags: ["bridge-v*"]
  workflow_dispatch:
    inputs:
      bridge_tag:
        description: "Bridge release tag (e.g. bridge-v0.1.0) — for re-runs without retagging"
        required: true

concurrency:
  group: release-bridge-${{ github.event.inputs.bridge_tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  # core ref the bridge builds against. Pin to a tag/branch as needed.
  CORE_REF: main

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            asset: systemprompt-bridge-x86_64-unknown-linux-gnu
          - target: aarch64-apple-darwin
            runner: macos-14
            asset: systemprompt-bridge-aarch64-apple-darwin
          - target: x86_64-apple-darwin
            runner: macos-14
            asset: systemprompt-bridge-x86_64-apple-darwin
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset: systemprompt-bridge-x86_64-pc-windows-msvc.exe
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: systemprompt-demo

      - name: Checkout systemprompt-core (sibling)
        uses: actions/checkout@v4
        with:
          repository: systempromptio/systemprompt-core
          ref: ${{ env.CORE_REF }}
          path: systemprompt-core
          token: ${{ secrets.CORE_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The repo pins a nightly in rust-toolchain.toml, so cargo builds with
      # that toolchain, not the stable one above. Running rustup from inside
      # the workspace installs the pinned toolchain plus the cross target's
      # std (without this, cross builds fail with E0463 "can't find crate std").
      - name: Install cross target for the pinned toolchain
        working-directory: systemprompt-demo/bridge
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: systemprompt-demo/bridge
          key: ${{ matrix.target }}

      # dbus-secret-service, tray-icon, and muda link Linux system libraries.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Build release binary
        working-directory: systemprompt-demo/bridge
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename output (unix)
        if: runner.os != 'Windows'
        working-directory: systemprompt-demo/bridge
        run: cp "target/${{ matrix.target }}/release/systemprompt-bridge" "${{ github.workspace }}/${{ matrix.asset }}"
      - name: Rename output (windows)
        if: runner.os == 'Windows'
        working-directory: systemprompt-demo/bridge
        run: Copy-Item "target/${{ matrix.target }}/release/systemprompt-bridge.exe" "${{ github.workspace }}/${{ matrix.asset }}"

      - name: Build macOS .app bundle (+ zip)
        if: runner.os == 'macOS'
        working-directory: systemprompt-demo/bridge
        run: |
          scripts/make-mac-app.sh --target ${{ matrix.target }}
          ditto -c -k --keepParent \
            "target/${{ matrix.target }}/release/SystempromptBridge.app" \
            "${{ github.workspace }}/${{ matrix.asset }}-app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}-app.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Sign & publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          tag="${{ github.event.inputs.bridge_tag || github.ref_name }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#bridge-v}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum systemprompt-bridge-* > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts (keyless)
        working-directory: dist
        run: |
          for f in systemprompt-bridge-* SHA256SUMS; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "${f}"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Systemprompt Bridge v${{ steps.tag.outputs.version }}
          make_latest: true
          body: |
            ## Systemprompt Bridge v${{ steps.tag.outputs.version }}

            The desktop companion for the [systemprompt.io](https://systemprompt.io) open gateway. The Bridge runs in your menu bar or system tray, signs you in with a device link, installs your workspace, and keeps your skills, agents, and MCP servers in sync inside Claude Code and Claude Cowork — while every request your AI tools make flows through a self-hosted gateway you own, with policy, audit trails, and cost attribution built in.

            ### Downloads

            | Platform | Asset |
            |----------|-------|
            | macOS (Apple Silicon) | `systemprompt-bridge-aarch64-apple-darwin-app.zip` |
            | macOS (Intel) | `systemprompt-bridge-x86_64-apple-darwin-app.zip` |
            | Windows | `systemprompt-bridge-x86_64-pc-windows-msvc.exe` |
            | Linux | `systemprompt-bridge-x86_64-unknown-linux-gnu` |

            Raw macOS binaries (no `.app` wrapper) are also attached. Checksums in `SHA256SUMS`.

            ### Install

            - **macOS** — unzip and drag `SystempromptBridge.app` to Applications ([macOS guide](https://github.com/systempromptio/systemprompt-demo/blob/main/docs/cowork/install-macos.md))
            - **Windows** — run the `.exe` ([Windows guide](https://github.com/systempromptio/systemprompt-demo/blob/main/docs/cowork/install-windows.md))
            - **Linux / headless** — install the binary onto your `PATH` and register with `systemprompt-bridge login`

            ### Verify (cosign keyless)

            Every asset is signed in CI via OIDC — the certificate binds the blob to this repository's workflow:

            ```bash
            cosign verify-blob \
              --certificate-identity-regexp='https://github.com/systempromptio/systemprompt-demo/' \
              --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
              --signature systemprompt-bridge-aarch64-apple-darwin-app.zip.sig \
              --certificate systemprompt-bridge-aarch64-apple-darwin-app.zip.pem \
              systemprompt-bridge-aarch64-apple-darwin-app.zip
            ```
          files: |
            dist/systemprompt-bridge-*
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
