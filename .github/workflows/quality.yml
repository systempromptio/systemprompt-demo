name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  # Rev of systemprompt-core the [patch.crates-io] workspace builds against.
  # Keep in lockstep with the committed .sqlx cache: bump it, run `just prepare`,
  # and commit both together.
  CORE_REV: "68811fcb8615b2a902596264c94aed6c49df35be"
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  # aws-lc-sys needs clang (GCC <10 bug #95189); ubuntu-latest ships it.
  CC: clang
  CXX: clang++

jobs:
  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout systemprompt-core (sibling, required by [patch.crates-io])
        run: |
          git clone https://github.com/systempromptio/systemprompt-core.git ../systemprompt-core
          git -C ../systemprompt-core checkout --quiet "$CORE_REV"
      # Clippy runs on the pinned nightly (channel + clippy component) declared
      # in rust-toolchain.toml, which `rustup show` installs — so lint results
      # match local `just clippy` with no channel duplicated here.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  docs:
    name: Rustdoc (warnings as errors)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - name: Checkout systemprompt-core (sibling, required by [patch.crates-io])
        run: |
          git clone https://github.com/systempromptio/systemprompt-core.git ../systemprompt-core
          git -C ../systemprompt-core checkout --quiet "$CORE_REV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  source-gates:
    name: Schema / SQL / error-boundary linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      # The five structural gate scripts ported from systemprompt-core, plus the
      # inlined no-synthesis guard (kept inline so this job does not depend on
      # `just` being installed).
      - run: bash scripts/lint-schema.sh
      - run: bash scripts/lint-extensions.sh
      - run: bash scripts/check-sqlx.sh
      - run: bash scripts/check-http-errors.sh
      - run: bash scripts/check-test-value.sh
      - run: bash scripts/lint-raw-ids.sh
      - run: bash scripts/check-glob-reexports.sh
      - name: No archaeology, caller-reference, or paraphrase comments
        run: bash scripts/check-comments.sh
      - name: "No unlisted inline comments (// Why: and // JSON: only)"
        run: bash scripts/lint-inline-comments.sh
      - name: Every pub type name is defined once
        run: bash scripts/check-duplicate-types.sh
      - name: Repository names match their return types
        run: bash scripts/check-repository-naming.sh
      - name: Every crate using query! macros has an offline cache
        run: bash scripts/check-sqlx-cache.sh
      # Skips cleanly without SIBLING_REPO, which this job does not set. Kept
      # here so the CI set matches `just lint-gates` exactly; it becomes a real
      # gate the moment a workflow supplies the sibling checkout.
      - name: Shared sources that differ from the fork are recorded
        run: bash scripts/check-fork-drift.sh
      # Downstream forks share these files but not their callers; a symbol is
      # only reported when it is dead here AND in the fork.
      - name: No dead repository code
        run: bash scripts/check-dead-repository-code.sh
      - name: Every production source has a `//!` module head
        run: bash scripts/check-file-headers.sh
      - name: No synthesized principals (UserId::new with string literal)
        run: |
          hits=$(grep -rEn 'UserId::new\("' extensions/ \
              --include='*.rs' \
              --exclude-dir=tests \
              --exclude-dir=bootstrap \
              || true)
          if [ -n "$hits" ]; then
            echo "error: forbidden synthesized principal — UserId::new with string literal"
            echo "$hits"
            echo
            echo "UserId::new must take a validated identifier (cookie, query, JWT"
            echo "claim, or DB row), never a hard-coded literal. Legitimate bootstrap"
            echo "code belongs under extensions/**/bootstrap/."
            exit 1
          fi

  file-size:
    name: Source file size guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No extension source file (excluding tests) may exceed 300 lines. Same
      # script as `just file-size`.
      - name: Enforce 300-line ceiling on extension sources
        run: bash scripts/check-file-size.sh
      # The file ceiling says nothing about one function, so a 154-line function
      # sat inside a passing file. Same script as `just function-size`.
      - name: Enforce 75-line ceiling on function bodies
        run: bash scripts/check-function-size.sh

  msrv:
    name: MSRV check (Rust 1.94)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout systemprompt-core (sibling, required by [patch.crates-io])
        run: |
          git clone https://github.com/systempromptio/systemprompt-core.git ../systemprompt-core
          git -C ../systemprompt-core checkout --quiet "$CORE_REV"
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo-deny (licenses, bans, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout systemprompt-core (sibling, required by [patch.crates-io])
        run: |
          git clone https://github.com/systempromptio/systemprompt-core.git ../systemprompt-core
          git -C ../systemprompt-core checkout --quiet "$CORE_REV"
      # Runner-native instead of EmbarkStudios/cargo-deny-action: the action
      # runs in a container that only mounts the workspace, so the sibling
      # ../systemprompt-core checkout the [patch.crates-io] needs is invisible.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  machete:
    name: Unused dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout systemprompt-core (sibling, required by [patch.crates-io])
        run: |
          git clone https://github.com/systempromptio/systemprompt-core.git ../systemprompt-core
          git -C ../systemprompt-core checkout --quiet "$CORE_REV"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      # Not a bare `cargo machete`: the root workspace excludes `tests` and
      # `bridge`, so the script enters each workspace in turn. Same script as
      # `just machete`.
      - run: bash scripts/machete.sh
